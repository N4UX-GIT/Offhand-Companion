name: Prepare unsigned signing candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prepare-signing-candidate:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate release tag and source metadata
        shell: powershell
        run: .\scripts\Assert-ReleaseVersion.ps1 -Tag '${{ github.ref_name }}'

      - name: Run security and behavior tests
        shell: powershell
        run: .\tests\run.ps1

      - name: Build unsigned executable
        shell: cmd
        run: build.bat dist\unsigned\Offhand.exe

      - name: Record unsigned artifact hash
        shell: powershell
        run: Get-FileHash -Algorithm SHA256 -LiteralPath .\dist\unsigned\Offhand.exe | Format-List

      - name: Upload unsigned artifact for manual certificate signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: offhand-companion-unsigned-${{ github.sha }}
          path: dist/unsigned/Offhand.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attest unsigned signing candidate
        uses: actions/attest@v4
        with:
          subject-path: dist/unsigned/Offhand.exe

      - name: Record signing handoff
        shell: powershell
        run: |
          @"
          ## Unsigned signing candidate prepared

          Download the `offhand-companion-unsigned-${{ github.sha }}` workflow
          artifact and record its SHA-256 before signing the contained executable.
          Sign those exact bytes through the approved certificate provider; do not
          rebuild the executable locally. Follow `docs/RELEASE.md` for verification,
          packaging, vendor submission, and publication.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
