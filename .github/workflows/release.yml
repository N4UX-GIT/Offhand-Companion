name: Sign and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  sign-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate release tag and source metadata
        shell: powershell
        run: .\scripts\Assert-ReleaseVersion.ps1 -Tag '${{ github.ref_name }}'

      - name: Run security and behavior tests
        shell: powershell
        run: .\tests\run.ps1

      - name: Build unsigned executable
        shell: cmd
        run: build.bat dist\unsigned\Offhand.exe

      - name: Upload unsigned artifact for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: offhand-companion-unsigned-${{ github.sha }}
          path: dist/unsigned/Offhand.exe
          if-no-files-found: error
          retention-days: 14

      - name: Submit SignPath release-signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'offhand-companion'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: '${{ github.workspace }}\dist\signed'

      - name: Verify signed executable and package release
        shell: powershell
        run: |
          .\scripts\New-Release.ps1 `
            -Version '${{ github.ref_name }}'.TrimStart('v') `
            -SignedArtifactDirectory .\dist\signed `
            -RequireSignPathSignature

      - name: Attest signed release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release/Offhand.exe
            dist/release/Offhand-Companion.zip
            dist/release/checksums-sha256.txt

      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/release/Offhand.exe
            dist/release/Offhand-Companion.zip
            dist/release/checksums-sha256.txt

